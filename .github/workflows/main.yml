name: Daily Job Notifier to Sheet

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 한국 시간 아침 8시 (UTC 23시)에 자동 실행
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python job_bot.py
